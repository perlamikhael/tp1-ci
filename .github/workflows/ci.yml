name: CI Pipeline

# Trigger this workflow only on commits to dev branch
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  unit-test-job:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 3: Install dependencies (if any)
      - name: Install dependencies
        run: pip install -r requirements.txt || echo "No requirements.txt found"

      # Step 4: Run Python unit tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "*.py"
